<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gacha RNG Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header Stats -->
  <div class="header">
    <div class="stat-box"><div class="stat-val gems" id="ui-gems">0</div><div class="stat-lbl">💎 Gems</div></div>
    <div class="stat-box"><div class="stat-val luck" id="ui-luck">0</div><div class="stat-lbl">🍀 Luck Lv</div></div>
    <div class="stat-box"><div class="stat-val" id="ui-temp-luck" style="color:var(--r-epic)">+0</div><div class="stat-lbl">🍀 Buff</div></div>
    <div class="stat-box"><div class="stat-val pity" id="ui-pity">0/50</div><div class="stat-lbl">🎯 Pity</div></div>
    <div class="stat-box"><div class="stat-val" id="ui-spins">0</div><div class="stat-lbl">🔄 Total Spin</div></div>
    <div class="stat-box"><div class="stat-val" id="ui-economy-tier" style="color:var(--r-uncommon)">Early</div><div class="stat-lbl">📊 Tier</div></div>
  </div>

  <!-- Banners & Countdown -->
  <div id="active-banner" class="event-banner"></div>
  <div id="event-countdown" class="event-banner" style="background:linear-gradient(90deg,#10b981,#3b82f6);"></div>
  <div id="special-event-banner"></div>

  <!-- Main Grid -->
  <div class="grid grid-3">
    <div class="card spin-area">
      <h3>🎰 Area Gacha</h3>
      <div class="result-box" id="result-display">Tekan SPIN untuk memulai...</div>
      <div style="margin-top:12px; display:flex; gap:8px; justify-content:center;">
        <button id="btn-spin">🎲 SPIN</button>
        <button id="btn-auto" class="btn-outline">▶️ Auto</button>
      </div>
      <div class="progress"><div class="progress-fill" id="pity-bar"></div></div>
    </div>

    <div class="card">
      <h3>🎒 Koleksi & Inventaris</h3>
      <div class="inventory-grid" id="inventory-grid"></div>
    </div>

    <div class="card">
      <h3>🛒 Toko & Milestone</h3>
      <div id="shop-item">
        <span>📦 Luck Crate Lv.<span id="next-luck">1</span></span>
        <button id="btn-buy-crate">Beli (<span id="crate-cost">100</span>💎)</button>
      </div>
      <div id="milestone-list" style="margin-top:12px; max-height:120px; overflow-y:auto;"></div>
      <button id="btn-notif-perm" class="btn-outline btn-sm" style="margin-top:8px;">🔔 Izinkan Notifikasi</button>
    </div>
  </div>

  <!-- Bottom Grid -->
  <div class="grid grid-2" style="margin-top:20px;">
    <div class="card">
      <h3>💾 Save / Load</h3>
      <div class="save-controls">
        <button id="btn-export" class="btn-outline">📤 Export</button>
        <button id="btn-import" class="btn-outline">📥 Import</button>
        <button id="btn-clear" class="btn-danger">🗑️ Reset</button>
      </div>
      <textarea id="save-input" placeholder="Tempel kode save/load di sini..."></textarea>
    </div>
    <div class="card">
      <h3 style="justify-content:space-between;">📜 Log Perjalanan 
        <button id="btn-changelog" class="btn-outline btn-sm">📜 Changelog</button>
      </h3>
      <div class="log-controls">
        <button id="btn-clear-log" class="btn-danger btn-sm">🗑️ Clear</button>
        <button id="btn-toggle-log" class="btn-outline btn-sm">⏸️ Pause</button>
        <button id="btn-scroll-log" class="btn-outline btn-sm">⬆️ Scroll</button>
      </div>
      <div class="log-box" id="log-box"></div>
    </div>
  </div>

  <!-- Changelog Modal -->
  <div id="changelog-modal" class="modal">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <h3>📜 Changelog Pengembangan</h3>
      <div id="changelog-list"></div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => console.log('SW tidak didukung/terblokir'));
    }
  </script>
</body>
</html>
